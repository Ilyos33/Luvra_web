<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Панель управления - LUVRA Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Nunito', sans-serif; }
  .gold { color: #C89B3C; }
  .bg-gold { background-color: #C89B3C; }
  .bg-gold:hover { background-color: #B8893C; }
  .ql-editor { min-height: 120px; }
</style>
</head>
<body class="bg-[#F9F6F1] min-h-screen">

<header class="bg-white border-b border-gray-200 sticky top-0 z-40">
  <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="https://customer-assets.emergentagent.com/job_650e5141-477b-4939-a745-c4f735d36886/artifacts/iogifv58_Liquid%20Soap%20500.png" class="h-10 w-10" alt="LUVRA">
      <h1 class="text-lg font-extrabold gold" data-i18n="admin.dashboard.title">Панель управления LUVRA</h1>
    </div>
    <div class="flex items-center gap-3">
      <span id="adminUsername" class="text-sm text-gray-500"></span>
      <button id="logoutBtn" class="px-4 py-2 border-2 border-[#C89B3C] gold rounded-lg font-semibold text-sm hover:bg-[#C89B3C] hover:text-white transition" data-i18n="admin.dashboard.logout">Выйти</button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-8">

  <!-- Tabs -->
  <div class="flex gap-2 mb-8 border-b border-gray-200">
    <button class="tab-btn px-5 py-3 font-semibold border-b-2 border-[#C89B3C] gold" data-tab="products" data-i18n="admin.dashboard.tab.products">Товары</button>
    <button class="tab-btn px-5 py-3 font-semibold border-b-2 border-transparent text-gray-500" data-tab="categories" data-i18n="admin.dashboard.tab.categories">Категории</button>
  </div>

  <!-- ===================== PRODUCTS TAB ===================== -->
  <section id="tab-products">
    <div class="flex justify-end mb-4">
      <button id="openProductFormBtn" class="px-5 py-2.5 bg-gold text-white rounded-lg font-semibold shadow transition" data-i18n="admin.dashboard.addProduct">+ Добавить товар</button>
    </div>

    <div id="productsList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    <p id="noProductsMsg" class="hidden text-center text-gray-400 py-16" data-i18n="admin.dashboard.noProducts">Товаров пока нет</p>
  </section>

  <!-- ===================== CATEGORIES TAB ===================== -->
  <section id="tab-categories" class="hidden">
    <div class="bg-white rounded-2xl shadow p-6 mb-6 max-w-lg">
      <h3 class="font-bold mb-4" data-i18n="admin.dashboard.addCategory">Добавить категорию</h3>
      <form id="categoryForm" class="space-y-3">
        <input type="hidden" name="id">
        <div>
          <label class="block text-sm font-semibold mb-1" data-i18n="admin.category.name_ru">Название (русский)</label>
          <input name="name_ru" required class="w-full border-2 border-gray-200 rounded-lg px-3 py-2 focus:border-[#C89B3C] focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1" data-i18n="admin.category.name_uz">Название (узбекский)</label>
          <input name="name_uz" required class="w-full border-2 border-gray-200 rounded-lg px-3 py-2 focus:border-[#C89B3C] focus:outline-none">
        </div>
        <div class="flex gap-2">
          <button type="submit" class="px-5 py-2 bg-gold text-white rounded-lg font-semibold" data-i18n="admin.category.save">Сохранить</button>
          <button type="button" id="categoryCancelBtn" class="hidden px-5 py-2 border-2 border-gray-300 rounded-lg font-semibold" data-i18n="admin.product.cancel">Отмена</button>
        </div>
      </form>
    </div>

    <div id="categoriesList" class="bg-white rounded-2xl shadow divide-y divide-gray-100 max-w-lg"></div>
    <p id="noCategoriesMsg" class="hidden text-center text-gray-400 py-16" data-i18n="admin.dashboard.noCategories">Категорий пока нет</p>
  </section>

</main>

<!-- ===================== PRODUCT FORM MODAL ===================== -->
<div id="productModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto">
  <div class="bg-white rounded-2xl w-full max-w-2xl my-8 max-h-[90vh] overflow-y-auto">
    <div class="p-6">
      <h2 id="productModalTitle" class="text-xl font-bold mb-6" data-i18n="admin.dashboard.addProduct">Добавить товар</h2>
      <form id="productForm" class="space-y-5">
        <input type="hidden" name="id">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1" data-i18n="admin.product.name_ru">Название (русский)</label>
            <input name="name_ru" required class="w-full border-2 border-gray-200 rounded-lg px-3 py-2 focus:border-[#C89B3C] focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1" data-i18n="admin.product.name_uz">Название (узбекский)</label>
            <input name="name_uz" required class="w-full border-2 border-gray-200 rounded-lg px-3 py-2 focus:border-[#C89B3C] focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1" data-i18n="admin.product.description_ru">Описание (русский)</label>
          <div id="editor_ru" class="bg-white"></div>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1" data-i18n="admin.product.description_uz">Описание (узбекский)</label>
          <div id="editor_uz" class="bg-white"></div>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1" data-i18n="admin.product.category">Категория</label>
          <select name="category_id" class="w-full border-2 border-gray-200 rounded-lg px-3 py-2 focus:border-[#C89B3C] focus:outline-none">
            <option value="" data-i18n="admin.product.categoryNone">Без категории</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1" data-i18n="admin.product.images">Изображения (jpg, png, gif, webp)</label>
          <input type="file" name="images" id="imagesInput" accept="image/jpeg,image/png,image/gif,image/webp" multiple class="w-full text-sm">
          <div id="imagePreviews" class="flex flex-wrap gap-3 mt-3"></div>
        </div>

        <label class="flex items-center gap-2">
          <input type="checkbox" name="is_active" checked class="w-4 h-4">
          <span class="text-sm font-semibold" data-i18n="admin.product.active">Показывать на сайте</span>
        </label>

        <div id="productFormError" class="hidden bg-red-50 text-red-600 text-sm rounded-lg px-4 py-3"></div>

        <div class="flex gap-2 pt-2">
          <button type="submit" class="px-6 py-2.5 bg-gold text-white rounded-lg font-semibold" data-i18n="admin.product.save">Сохранить</button>
          <button type="button" id="productCancelBtn" class="px-6 py-2.5 border-2 border-gray-300 rounded-lg font-semibold" data-i18n="admin.product.cancel">Отмена</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/js/i18n.js"></script>
<script src="/js/admin-dashboard.js"></script>
</body>
</html>
